<!DOCTYPE html>
<html>
<head>
  <title>Bite Club</title>
</head>
<body>
  <h1>Bite Club</h1>

  <form method="get" action="/">
    <input type="text" name="term" value="{{ term }}" placeholder="tacos, ramen, pizza">
    <button type="submit">Search</button>
  </form>

  <ul>
    {% for r in restaurants %}
      <li>
        <a href="/restaurant/{{ r.id }}">{{ r.name }}</a>
        — {{ r.cuisine }} — {{ r.address }}
      </li>
    {% endfor %}
  </ul>
</body>
</html>
